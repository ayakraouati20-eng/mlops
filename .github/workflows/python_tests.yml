name: Python Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --with dev --no-root
    
    - name: Run API Tests
      run: |
        poetry run pytest tests/test_api.py -v
    
    - name: Run Model Tests (if data available)
      run: |
        poetry run pytest tests/test_models.py -v --continue-on-collection-errors || echo "Model tests skipped (data not available in CI)"
    
    - name: Generate Coverage Report
      run: |
        poetry run pytest tests/test_api.py --cov=api --cov-report=xml --cov-report=term
    
    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage.xml
        fail_ci_if_error: false