version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: immoprix-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - immoprix-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: immoprix-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
    networks:
      - immoprix-network

networks:
  immoprix-network:
    driver: bridge